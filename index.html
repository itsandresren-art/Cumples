<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario Musical</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
    
    body { 
      background-color: #000000; 
      color: #ededed; 
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
      -webkit-font-smoothing: antialiased;
    }

    .border-subtle { border-color: #1a1a1a; }
    .bg-card { background-color: #0a0a0a; }

    .calendar-day {
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .calendar-day:hover {
      border-color: #333333;
      background-color: #111111;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-6 md:p-12">

  <!-- Header Minimalista -->
  <header class="max-w-4xl mx-auto w-full flex justify-between items-center mb-12">
    <div class="cursor-pointer" onclick="goHome()">
      <h1 class="text-lg font-medium tracking-tight text-white">Calendario Musical</h1>
      <p class="text-xs text-zinc-500 font-light mt-0.5">Lanzamientos de álbumes</p>
    </div>

    <button id="adminBtn" onclick="toggleAdmin()" class="text-xs text-zinc-400 hover:text-white border border-subtle hover:border-zinc-700 rounded-full px-3.5 py-1.5 transition flex items-center gap-2">
      <i class="fa-solid fa-lock text-[10px]" id="adminIcon"></i> <span id="adminText">Admin</span>
    </button>
  </header>

  <!-- Vista Principal: Calendario -->
  <main id="mainView" class="max-w-4xl mx-auto w-full flex-1">
    
    <!-- Controles de Mes -->
    <div class="flex justify-between items-center mb-8">
      <h2 id="monthTitle" class="text-2xl font-light tracking-tight text-white">
        Enero
      </h2>
      <div class="flex items-center gap-1">
        <button onclick="changeMonth(-1)" class="w-8 h-8 rounded-lg border border-subtle hover:border-zinc-700 flex items-center justify-center text-zinc-400 hover:text-white transition">
          <i class="fa-solid fa-chevron-left text-xs"></i>
        </button>
        <button onclick="changeMonth(1)" class="w-8 h-8 rounded-lg border border-subtle hover:border-zinc-700 flex items-center justify-center text-zinc-400 hover:text-white transition">
          <i class="fa-solid fa-chevron-right text-xs"></i>
        </button>
      </div>
    </div>

    <!-- Encabezado de Días -->
    <div class="grid grid-cols-7 gap-2 mb-2 text-center text-[11px] text-zinc-600 font-medium uppercase tracking-wider">
      <div>Dom</div><div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div>
    </div>

    <!-- Grid del Calendario -->
    <div id="calendarGrid" class="grid grid-cols-7 gap-2"></div>
  </main>

  <!-- Vista Álbum en Pantalla Completa -->
  <main id="albumPage" class="max-w-2xl mx-auto w-full flex-1 hidden">
    <button onclick="goHome()" class="mb-8 text-xs text-zinc-500 hover:text-white flex items-center gap-2 transition">
      <i class="fa-solid fa-arrow-left text-[10px]"></i> Volver al calendario
    </button>
    <div class="bg-card rounded-2xl p-8 border border-subtle" id="albumPageContent"></div>
  </main>

  <!-- Modal para Día / Formulario -->
  <div id="modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-card max-w-md w-full rounded-2xl p-6 relative border border-subtle max-h-[85vh] overflow-y-auto">
      <button onclick="closeModal()" class="absolute top-5 right-5 text-zinc-500 hover:text-white text-sm">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <div id="modalContent"></div>
    </div>
  </div>

    const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
    let currentMonth = 0;
    let isAdmin = false;
    let adminPassword = localStorage.getItem('adminPass') || '1234';

    // Fuerza a cargar la base de datos completa de todos los meses
    localStorage.removeItem('musicCalendarDB');
    localStorage.removeItem('musicCalendarDB_v2');
    let db = JSON.parse(localStorage.getItem('musicCalendarDB_v3')) || fullMusicData;

    function saveDB() {
      localStorage.setItem('musicCalendarDB_v3', JSON.stringify(db));
      renderCalendar(currentMonth);
    }

    function toggleAdmin() {
      if (!isAdmin) {
        const pass = prompt("Contraseña de administrador:");
        if (pass === adminPassword) {
          isAdmin = true;
          document.getElementById('adminIcon').className = "fa-solid fa-lock-open text-emerald-400";
          document.getElementById('adminText').innerText = "Admin Activo";
          renderCalendar(currentMonth);
        } else if (pass !== null) {
          alert("Contraseña incorrecta.");
        }
      } else {
        isAdmin = false;
        document.getElementById('adminIcon').className = "fa-solid fa-lock";
        document.getElementById('adminText').innerText = "Admin";
        renderCalendar(currentMonth);
      }
    }

    function changeMonth(delta) {
      currentMonth = (currentMonth + delta + 12) % 12;
      renderCalendar(currentMonth);
    }

    function handleImageError(img) {
      img.onerror = null;
      img.src = 'https://images.placeholders.dev/?width=300&height=300&text=🎵&bgColor=%23111111&textColor=%23777777';
    }

    async function getAppleCoverUrl(title, artist) {
      if (!title) return '';
      const query = encodeURIComponent(`${title} ${artist || ''}`);
      try {
        const res = await fetch(`https://itunes.apple.com/search?term=${query}&entity=album&limit=1`);
        const data = await res.json();
        if (data.results && data.results.length > 0) {
          return data.results[0].artworkUrl100.replace('100x100bb', '400x400bb');
        }
      } catch (e) {
        console.log("Cover fetch fallback");
      }
      return 'https://images.placeholders.dev/?width=300&height=300&text=🎵&bgColor=%23111111&textColor=%23777777';
    }

    function renderCalendar(month) {
      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';
      document.getElementById('monthTitle').innerText = monthNames[month];

      const daysInMonth = new Date(2026, month + 1, 0).getDate();
      const firstDay = new Date(2026, month, 1).getDay();

      for (let i = 0; i < firstDay; i++) {
        grid.appendChild(Object.assign(document.createElement('div'), { className: "h-20 rounded-xl bg-zinc-950/40" }));
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const key = `${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const releases = db[key] || [];

        const dayCell = document.createElement('div');
        dayCell.className = `calendar-day h-20 rounded-xl p-2.5 cursor-pointer flex flex-col justify-between border ${
          releases.length > 0 ? 'bg-card border-zinc-800' : 'bg-black border-subtle'
        }`;

        let html = `<div class="flex justify-between items-center"><span class="text-xs font-normal ${releases.length > 0 ? 'text-white' : 'text-zinc-600'}">${day}</span>`;
        if (isAdmin) {
          html += `<button onclick="event.stopPropagation(); openEditForm('${key}')" class="text-[9px] text-zinc-400 hover:text-white"><i class="fa-solid fa-plus"></i></button>`;
        }
        html += `</div>`;

        if (releases.length > 0) {
          html += `
            <div class="truncate text-[10px] text-zinc-400 flex items-center gap-1.5">
              <span class="w-1.5 h-1.5 rounded-full bg-purple-500 shrink-0"></span>
              <span class="truncate">${releases[0].title}</span>
            </div>
          `;
        }
        dayCell.innerHTML = html;
        dayCell.onclick = () => openDayModal(key, day, monthNames[month]);
        grid.appendChild(dayCell);
      }
    }

    async function openDayModal(key, day, monthName) {
      const items = db[key] || [];
      let html = `
        <div class="mb-6 flex justify-between items-center border-b border-subtle pb-4">
          <h3 class="text-base font-medium text-white">${day} de ${monthName}</h3>
          <button onclick="copyDayLink('${key}')" class="text-xs text-zinc-500 hover:text-zinc-300 transition">
            <i class="fa-solid fa-share-nodes"></i> Compartir
          </button>
        </div>
      `;

      if (items.length === 0) {
        html += `<p class="text-xs text-zinc-600 italic py-6 text-center">Sin lanzamientos.</p>`;
      } else {
        for (const item of items) {
          let coverUrl = item.cover;
          if (!coverUrl) {
            coverUrl = await getAppleCoverUrl(item.title, item.artist);
            item.cover = coverUrl;
          }

          html += `
            <div class="mb-4 p-3 rounded-xl border border-subtle bg-black flex items-center gap-3">
              <img src="${coverUrl}" onerror="handleImageError(this)" class="w-12 h-12 rounded-lg object-cover bg-zinc-900 shadow-md">
              <div class="flex-1 min-w-0">
                <h4 class="font-medium text-xs text-white truncate cursor-pointer hover:text-purple-400 transition" onclick="showAlbumPage('${key}', '${item.id}')">${item.title}</h4>
                <p class="text-[11px] text-zinc-500 truncate">${item.artist || 'Artista'}</p>
                <div class="flex gap-2 mt-1">
                  ${item.spotify ? `<a href="${item.spotify}" target="_blank" class="text-[10px] text-zinc-400 hover:text-emerald-400"><i class="fa-brands fa-spotify"></i> Spotify</a>` : ''}
                  ${item.apple ? `<a href="${item.apple}" target="_blank" class="text-[10px] text-zinc-400 hover:text-pink-400"><i class="fa-brands fa-apple"></i> Apple</a>` : ''}
                </div>
              </div>
              ${isAdmin ? `
                <div class="flex gap-2">
                  <button onclick="openEditForm('${key}', '${item.id}')" class="text-xs text-zinc-500 hover:text-amber-400"><i class="fa-solid fa-pen"></i></button>
                  <button onclick="deleteAlbum('${key}', '${item.id}')" class="text-xs text-zinc-500 hover:text-rose-400"><i class="fa-solid fa-trash"></i></button>
                </div>
              ` : ''}
            </div>
          `;
        }
      }

      if (isAdmin) {
        html += `<button onclick="openEditForm('${key}')" class="w-full mt-2 py-2 border border-subtle hover:border-zinc-700 text-zinc-300 text-xs rounded-xl transition">+ Agregar Álbum</button>`;
      }

      document.getElementById('modalContent').innerHTML = html;
      document.getElementById('modal').classList.remove('hidden');
      document.getElementById('modal').classList.add('flex');
    }

    function openEditForm(key, albumId = null) {
      const item = albumId && db[key] ? db[key].find(a => a.id === albumId) : { title: '', artist: '', note: '', cover: '', spotify: '', apple: '' };
      
      let html = `
        <h3 class="text-sm font-medium text-white mb-4">${albumId ? 'Editar Álbum' : 'Agregar Álbum'}</h3>
        <form onsubmit="saveAlbumForm(event, '${key}', '${albumId || ''}')" class="space-y-3">
          <div>
            <label class="text-[10px] text-zinc-500 uppercase">Álbum / Canción</label>
            <input type="text" id="formTitle" value="${item.title}" required class="w-full bg-black border border-subtle rounded-lg p-2 text-xs text-white focus:outline-none focus:border-zinc-700">
          </div>
          <div>
            <label class="text-[10px] text-zinc-500 uppercase">Artista</label>
            <input type="text" id="formArtist" value="${item.artist}" class="w-full bg-black border border-subtle rounded-lg p-2 text-xs text-white focus:outline-none focus:border-zinc-700">
          </div>
          <div>
            <label class="text-[10px] text-zinc-500 uppercase">Spotify Link</label>
            <input type="url" id="formSpotify" value="${item.spotify}" class="w-full bg-black border border-subtle rounded-lg p-2 text-xs text-white focus:outline-none focus:border-zinc-700">
          </div>
          <div>
            <label class="text-[10px] text-zinc-500 uppercase">Apple Music Link</label>
            <input type="url" id="formApple" value="${item.apple}" class="w-full bg-black border border-subtle rounded-lg p-2 text-xs text-white focus:outline-none focus:border-zinc-700">
          </div>
          <div>
            <label class="text-[10px] text-zinc-500 uppercase">URL Portada Imagen (Opcional)</label>
            <input type="url" id="formCover" value="${item.cover}" class="w-full bg-black border border-subtle rounded-lg p-2 text-xs text-white focus:outline-none focus:border-zinc-700">
          </div>
          <div>
            <label class="text-[10px] text-zinc-500 uppercase">Nota</label>
            <textarea id="formNote" class="w-full bg-black border border-subtle rounded-lg p-2 text-xs text-white focus:outline-none focus:border-zinc-700">${item.note}</textarea>
          </div>
          <button type="submit" class="w-full bg-white text-black py-2 rounded-lg font-medium text-xs transition hover:bg-zinc-200">Guardar</button>
        </form>
      `;

      document.getElementById('modalContent').innerHTML = html;
      document.getElementById('modal').classList.remove('hidden');
      document.getElementById('modal').classList.add('flex');
    }

    async function saveAlbumForm(e, key, albumId) {
      e.preventDefault();
      if (!db[key]) db[key] = [];

      const title = document.getElementById('formTitle').value;
      const artist = document.getElementById('formArtist').value;
      let cover = document.getElementById('formCover').value;

      if (!cover) {
        cover = await getAppleCoverUrl(title, artist);
      }

      const newAlbum = {
        id: albumId || String(Date.now()),
        title: title,
        artist: artist,
        spotify: document.getElementById('formSpotify').value,
        apple: document.getElementById('formApple').value,
        cover: cover,
        note: document.getElementById('formNote').value
      };

      if (albumId) {
        const idx = db[key].findIndex(a => a.id === albumId);
        if (idx !== -1) db[key][idx] = newAlbum;
      } else {
        db[key].push(newAlbum);
      }

      saveDB();
      closeModal();
    }

    function deleteAlbum(key, albumId) {
      if (confirm("¿Eliminar este álbum?")) {
        db[key] = db[key].filter(a => a.id !== albumId);
        saveDB();
        closeModal();
      }
    }

    async function showAlbumPage(key, albumId) {
      const album = db[key].find(a => a.id === albumId);
      closeModal();
      document.getElementById('mainView').classList.add('hidden');
      const albumPage = document.getElementById('albumPage');

      let coverUrl = album.cover;
      if (!coverUrl) {
        coverUrl = await getAppleCoverUrl(album.title, album.artist);
      }
      
      document.getElementById('albumPageContent').innerHTML = `
        <div class="flex flex-col sm:flex-row gap-6 items-center">
          <img src="${coverUrl}" onerror="handleImageError(this)" class="w-48 h-48 object-cover rounded-xl border border-subtle bg-zinc-900 shadow-xl">
          <div class="flex-1 text-center sm:text-left">
            <h1 class="text-xl font-medium text-white mb-1">${album.title}</h1>
            <h3 class="text-sm text-zinc-400 mb-4">${album.artist}</h3>
            ${album.note ? `<p class="text-xs text-zinc-400 italic mb-6 bg-black p-3 rounded-lg border border-subtle">"${album.note}"</p>` : ''}
            <div class="flex gap-3 justify-center sm:justify-start">
              ${album.spotify ? `<a href="${album.spotify}" target="_blank" class="border border-subtle text-zinc-300 hover:text-white text-xs px-3.5 py-1.5 rounded-lg flex items-center gap-2 transition"><i class="fa-brands fa-spotify text-emerald-400"></i> Spotify</a>` : ''}
              ${album.apple ? `<a href="${album.apple}" target="_blank" class="border border-subtle text-zinc-300 hover:text-white text-xs px-3.5 py-1.5 rounded-lg flex items-center gap-2 transition"><i class="fa-brands fa-apple text-pink-400"></i> Apple Music</a>` : ''}
            </div>
          </div>
        </div>
      `;
      albumPage.classList.remove('hidden');
    }

    function goHome() {
      document.getElementById('albumPage').classList.add('hidden');
      document.getElementById('mainView').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
      document.getElementById('modal').classList.remove('flex');
    }

    function copyDayLink(key) {
      const url = `${window.location.origin}${window.location.pathname}?fecha=${key}`;
      navigator.clipboard.writeText(url);
      alert('¡Enlace copiado al portapapeles!\n' + url);
    }

    window.onload = () => {
      renderCalendar(currentMonth);
      const urlParams = new URLSearchParams(window.location.search);
      const fecha = urlParams.get('fecha');
      if (fecha && db[fecha]) {
        const [m, d] = fecha.split('-');
        currentMonth = parseInt(m) - 1;
        renderCalendar(currentMonth);
        openDayModal(fecha, parseInt(d), monthNames[currentMonth]);
      }
    };
  </script>
</body>
</html>
