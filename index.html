<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario Musical</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .vinyl-spin {
      animation: spin 10s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .glass-panel {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .calendar-day {
      transition: all 0.2s ease;
    }
    .calendar-day:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 md:p-8">

  <!-- Encabezado -->
  <header class="max-w-6xl mx-auto w-full flex flex-col md:flex-row justify-between items-center gap-4 mb-8">
    <div class="flex items-center gap-3">
      <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-purple-600 to-pink-500 flex items-center justify-center shadow-lg">
        <i class="fa-solid fa-compact-disc text-2xl text-white vinyl-spin"></i>
      </div>
      <div>
        <h1 class="text-2xl font-bold tracking-tight">Calendario Musical</h1>
        <p class="text-xs text-slate-400">Descubre los álbumes lanzados cada día del año</p>
      </div>
    </div>

    <!-- Controles superiores -->
    <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
      <div class="relative flex-1 md:w-64">
        <input type="text" id="searchInput" placeholder="Buscar artista, canción..." 
               class="w-full bg-slate-800 border border-slate-700 rounded-full py-2 px-4 pl-10 text-sm focus:outline-none focus:border-purple-500">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-sm"></i>
      </div>

      <button id="randomBtn" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-full px-4 py-2 text-sm flex items-center gap-2 transition">
        <i class="fa-solid fa-shuffle text-purple-400"></i> Aleatorio
      </button>

      <button id="adminBtn" class="bg-purple-600 hover:bg-purple-500 text-white rounded-full px-4 py-2 text-sm flex items-center gap-2 transition font-medium shadow-md">
        <i class="fa-solid fa-lock" id="adminIcon"></i> Modo Admin
      </button>
    </div>
  </header>

  <!-- Navegación de Meses -->
  <main class="max-w-6xl mx-auto w-full flex-1">
    <div class="glass-panel rounded-2xl p-6 mb-8 shadow-2xl">
      <div class="flex justify-between items-center mb-6">
        <button id="prevMonth" class="p-2 rounded-full hover:bg-slate-700 text-slate-300 transition">
          <i class="fa-solid fa-chevron-left text-xl"></i>
        </button>
        <h2 id="monthTitle" class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-400 uppercase tracking-wider">
          Enero
        </h2>
        <button id="nextMonth" class="p-2 rounded-full hover:bg-slate-700 text-slate-300 transition">
          <i class="fa-solid fa-chevron-right text-xl"></i>
        </button>
      </div>

      <!-- Días de la semana -->
      <div class="grid grid-cols-7 gap-2 mb-2 text-center font-semibold text-xs text-slate-400 uppercase tracking-wider">
        <div>Dom</div><div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div>
      </div>

      <!-- Rejilla del Calendario -->
      <div id="calendarGrid" class="grid grid-cols-7 gap-2 md:gap-3"></div>
    </div>
  </main>

  <!-- Modal de Detalle / Edición de Canción -->
  <div id="modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="glass-panel max-w-lg w-full rounded-2xl p-6 relative shadow-2xl border border-slate-700 max-h-[90vh] overflow-y-auto">
      <button id="closeModal" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <div id="modalContent">
        <!-- Generado dinámicamente -->
      </div>
    </div>
  </div>

    // Meses
    const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
    let currentMonth = 0; // Enero
    let isAdmin = false;

    // Cargar datos locales guardados
    const savedData = localStorage.getItem('musicCalendarData');
    const db = savedData ? JSON.parse(savedData) : musicData;

    function renderCalendar(month) {
      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';
      document.getElementById('monthTitle').innerText = monthNames[month];

      const daysInMonth = new Date(2026, month + 1, 0).getDate();
      const firstDay = new Date(2026, month, 1).getDay();

      // Espacios vacíos
      for (let i = 0; i < firstDay; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = "h-20 md:h-24 rounded-xl bg-slate-900/40 opacity-30";
        grid.appendChild(emptyCell);
      }

      // Días
      for (let day = 1; day <= daysInMonth; day++) {
        const monthKey = String(month + 1).padStart(2, '0');
        const dayKey = String(day).padStart(2, '0');
        const key = `${monthKey}-${dayKey}`;
        const releases = db[key] || [];

        const dayCell = document.createElement('div');
        dayCell.className = `calendar-day h-20 md:h-24 rounded-xl p-2 cursor-pointer flex flex-col justify-between border ${
          releases.length > 0 ? 'bg-slate-800/80 border-purple-500/40 hover:border-purple-400' : 'bg-slate-900/60 border-slate-800 hover:border-slate-700'
        }`;

        let contentHtml = `<span class="text-xs font-bold ${releases.length > 0 ? 'text-purple-400' : 'text-slate-500'}">${day}</span>`;

        if (releases.length > 0) {
          contentHtml += `
            <div class="truncate text-[10px] font-medium text-slate-200 bg-purple-950/60 p-1 rounded border border-purple-800/40">
              <i class="fa-solid fa-music text-[9px] text-pink-400 mr-1"></i>${releases[0].title}
              ${releases.length > 1 ? `<span class="text-pink-400 font-bold ml-1">+${releases.length - 1}</span>` : ''}
            </div>
          `;
        } else {
          contentHtml += `<div class="text-[9px] text-slate-600 italic">Sin registros</div>`;
        }

        dayCell.innerHTML = contentHtml;
        dayCell.onclick = () => openDayModal(key, day, monthNames[month]);
        grid.appendChild(dayCell);
      }
    }

    function openDayModal(key, day, monthName) {
      const modal = document.getElementById('modal');
      const container = document.getElementById('modalContent');
      const items = db[key] || [];

      let html = `
        <div class="mb-4 flex justify-between items-center border-b border-slate-700 pb-3">
          <div>
            <h3 class="text-xl font-bold text-purple-300">${day} de ${monthName}</h3>
            <p class="text-xs text-slate-400">${items.length} lanzamiento(s) registrado(s)</p>
          </div>
          <button onclick="copyDayLink('${key}')" class="bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 flex items-center gap-1.5 transition">
            <i class="fa-solid fa-share-nodes text-purple-400"></i> Compartir Día
          </button>
        </div>
      `;

      if (items.length === 0) {
        html += `<p class="text-sm text-slate-400 italic py-6 text-center">No hay canciones registradas para este día.</p>`;
      } else {
        items.forEach((item, index) => {
          html += `
            <div class="mb-4 p-4 rounded-xl bg-slate-800/60 border border-slate-700 flex flex-col sm:flex-row gap-4 items-center">
              <div class="w-24 h-24 rounded-lg bg-slate-900 border border-slate-700 overflow-hidden flex-shrink-0 flex items-center justify-center relative shadow-md">
                ${item.cover ? `<img src="${item.cover}" alt="Portada" class="w-full h-full object-cover">` : '<i class="fa-solid fa-compact-disc text-3xl text-slate-600"></i>'}
              </div>
              <div class="flex-1 text-center sm:text-left">
                <h4 class="font-bold text-base text-white">${item.title}</h4>
                <p class="text-sm text-purple-300">${item.artist || 'Artista no especificado'}</p>
                ${item.note ? `<p class="text-xs text-slate-400 italic mt-1 bg-slate-900/50 p-1.5 rounded border border-slate-800">"${item.note}"</p>` : ''}

                <div class="flex flex-wrap gap-2 mt-3 justify-center sm:justify-start">
                  ${item.spotify ? `<a href="${item.spotify}" target="_blank" class="text-xs bg-emerald-600/20 text-emerald-400 hover:bg-emerald-600/30 px-2.5 py-1 rounded-md flex items-center gap-1 border border-emerald-500/30"><i class="fa-brands fa-spotify"></i> Spotify</a>` : ''}
                  ${item.apple ? `<a href="${item.apple}" target="_blank" class="text-xs bg-pink-600/20 text-pink-400 hover:bg-pink-600/30 px-2.5 py-1 rounded-md flex items-center gap-1 border border-pink-500/30"><i class="fa-brands fa-apple"></i> Apple Music</a>` : ''}
                </div>
              </div>
            </div>
          `;
        });
      }

      container.innerHTML = html;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function copyDayLink(key) {
      const url = `${window.location.origin}${window.location.pathname}?fecha=${key}`;
      navigator.clipboard.writeText(url);
      alert('¡Enlace copiado al portapapeles!\n' + url);
    }

    // Inicializar navegación de meses
    document.getElementById('prevMonth').onclick = () => {
      currentMonth = (currentMonth - 1 + 12) % 12;
      renderCalendar(currentMonth);
    };

    document.getElementById('nextMonth').onclick = () => {
      currentMonth = (currentMonth + 1) % 12;
      renderCalendar(currentMonth);
    };

    document.getElementById('closeModal').onclick = () => {
      document.getElementById('modal').classList.add('hidden');
      document.getElementById('modal').classList.remove('flex');
    };

    // Verificar si viene una fecha en la URL (?fecha=MM-DD)
    window.onload = () => {
      renderCalendar(currentMonth);
      const urlParams = new URLSearchParams(window.location.search);
      const fecha = urlParams.get('fecha');
      if (fecha && db[fecha]) {
        const [m, d] = fecha.split('-');
        currentMonth = parseInt(m) - 1;
        renderCalendar(currentMonth);
        openDayModal(fecha, parseInt(d), monthNames[currentMonth]);
      }
    };
  </script>
</body>
</html>
