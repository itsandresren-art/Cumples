<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario Musical</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    
    body { 
      background-color: #000000; 
      color: #ededed; 
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
      -webkit-font-smoothing: antialiased;
      perspective: 1000px;
    }

    .border-subtle { border-color: #1a1a1a; }
    .bg-card { background-color: #0a0a0a; }

    .calendar-day {
      transition: transform 0.15s ease-out, border-color 0.2s ease, box-shadow 0.2s ease;
      transform-style: preserve-3d;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .calendar-day:hover {
      border-color: #666666;
      box-shadow: 0 10px 25px -5px rgba(255, 255, 255, 0.12);
      z-index: 20;
    }

    .glow-card {
      position: relative;
      overflow: hidden;
    }

    .glow-bg {
      position: absolute;
      inset: -30px;
      background-size: cover;
      background-position: center;
      filter: blur(50px) brightness(0.45) opacity(0.85);
      z-index: 0;
      transition: all 0.5s ease;
    }

    .glow-content {
      position: relative;
      z-index: 10;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-6 md:p-12">

  <header class="max-w-4xl mx-auto w-full flex justify-between items-center mb-12">
    <div id="brandLogo" class="cursor-pointer" onclick="goHome()">
      <h1 class="text-lg font-medium tracking-tight text-white">Calendario Musical</h1>
      <p class="text-xs text-zinc-500 font-light mt-0.5">Lanzamientos de álbumes</p>
    </div>

    <button id="adminBtn" onclick="toggleAdmin()" class="text-xs text-zinc-400 hover:text-white border border-subtle hover:border-zinc-700 rounded-full px-3.5 py-1.5 transition flex items-center gap-2">
      <i class="fa-solid fa-lock text-[10px]" id="adminIcon"></i> <span id="adminText">Admin</span>
    </button>
  </header>

  <main id="mainView" class="max-w-4xl mx-auto w-full flex-1">
    <div class="flex justify-between items-center mb-8">
      <h2 id="monthTitle" class="text-2xl font-light tracking-tight text-white">Enero</h2>
      <div class="flex items-center gap-1">
        <button onclick="changeMonth(-1)" class="w-8 h-8 rounded-lg border border-subtle hover:border-zinc-700 flex items-center justify-center text-zinc-400 hover:text-white transition">
          <i class="fa-solid fa-chevron-left text-xs"></i>
        </button>
        <button onclick="changeMonth(1)" class="w-8 h-8 rounded-lg border border-subtle hover:border-zinc-700 flex items-center justify-center text-zinc-400 hover:text-white transition">
          <i class="fa-solid fa-chevron-right text-xs"></i>
        </button>
      </div>
    </div>

    <div class="grid grid-cols-7 gap-2 mb-2 text-center text-[11px] text-zinc-600 font-medium uppercase tracking-wider">
      <div>Dom</div><div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div>
    </div>

    <div id="calendarGrid" class="grid grid-cols-7 gap-2"></div>
  </main>

  <main id="albumPage" class="max-w-2xl mx-auto w-full flex-1 hidden">
    <div class="bg-card rounded-2xl p-8 border border-subtle glow-card" id="albumPageCard">
      <div id="albumGlowBg" class="glow-bg"></div>
      <div class="glow-content" id="albumPageContent"></div>
    </div>
  </main>

  <div id="modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-card max-w-md w-full rounded-2xl p-6 relative border border-subtle max-h-[90vh] overflow-y-auto" id="modalContainer">
      <button onclick="closeModal()" class="absolute top-5 right-5 text-zinc-500 hover:text-white text-sm z-50">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <div id="modalContent"></div>
    </div>
  </div>

    };

    const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
    let currentMonth = new Date().getMonth();
    let isAdmin = false;
    let isIsolatedMode = false;

    // Borramos todas las bases de datos antiguas almacenadas
    for (let i = 1; i <= 49; i++) {
      localStorage.removeItem(`musicCalendarDB_v${i}`);
    }

    let db = JSON.parse(localStorage.getItem('musicCalendarDB_v50')) || fullMusicData;

    function getTodayKey() {
      const today = new Date();
      const m = String(today.getMonth() + 1).padStart(2, '0');
      const d = String(today.getDate()).padStart(2, '0');
      return `${m}-${d}`;
    }

    function saveDB() {
      localStorage.setItem('musicCalendarDB_v50', JSON.stringify(db));
      renderCalendar(currentMonth);
    }

    function toggleAdmin() {
      const adminPassword = 'roxin';
      if (!isAdmin) {
        const pass = prompt("Contraseña de administrador:");
        if (pass === adminPassword) {
          isAdmin = true;
          document.getElementById('adminIcon').className = "fa-solid fa-lock-open text-emerald-400";
          document.getElementById('adminText').innerText = "Admin Activo";
          renderCalendar(currentMonth);
        } else if (pass !== null) {
          alert("Contraseña incorrecta.");
        }
      } else {
        isAdmin = false;
        document.getElementById('adminIcon').className = "fa-solid fa-lock";
        document.getElementById('adminText').innerText = "Admin";
        renderCalendar(currentMonth);
      }
    }

    function changeMonth(delta) {
      if (isIsolatedMode) return;
      currentMonth = (currentMonth + delta + 12) % 12;
      renderCalendar(currentMonth);
    }

    function handleImageError(img) {
      img.onerror = null;
      img.src = 'https://images.placeholders.dev/?width=300&height=300&text=🎵&bgColor=%23111111&textColor=%23777777';
    }

    function renderCalendar(month) {
      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';
      document.getElementById('monthTitle').innerText = monthNames[month];

      const daysInMonth = new Date(2026, month + 1, 0).getDate();
      const firstDay = new Date(2026, month, 1).getDay();
      const todayKey = getTodayKey();

      for (let i = 0; i < firstDay; i++) {
        grid.appendChild(Object.assign(document.createElement('div'), { className: "h-24 rounded-xl bg-zinc-950/40" }));
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const key = `${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const releases = db[key] || [];
        const isToday = key === todayKey;

        const dayCell = document.createElement('div');
        dayCell.className = `calendar-day h-24 rounded-xl p-2.5 cursor-pointer flex flex-col justify-between border overflow-hidden relative ${
          isToday ? 'border-purple-500 shadow-lg shadow-purple-500/20' : (releases.length > 0 ? 'border-zinc-800' : 'bg-black border-subtle')
        }`;

        if (releases.length > 0) {
          let mainAlbum = releases.find(a => a.isMainCover) || releases[0];
          if (mainAlbum && mainAlbum.cover) {
            dayCell.style.backgroundImage = `linear-gradient(to top, rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.3)), url("${mainAlbum.cover}")`;
          }
        }

        dayCell.onmousemove = (e) => {
          const rect = dayCell.getBoundingClientRect();
          const x = e.clientX - rect.left - rect.width / 2;
          const y = e.clientY - rect.top - rect.height / 2;
          dayCell.style.transform = `rotateY(${x / 8}deg) rotateX(${-y / 8}deg) scale(1.04)`;
        };

        dayCell.onmouseleave = () => {
          dayCell.style.transform = `rotateY(0deg) rotateX(0deg) scale(1)`;
        };

        let html = `<div class="flex justify-between items-center relative z-10"><span class="text-xs ${isToday ? 'text-purple-400 font-bold' : (releases.length > 0 ? 'text-white font-medium' : 'text-zinc-600')}">${day}</span>`;
        if (isAdmin) {
          html += `<button onclick="event.stopPropagation(); openEditForm('${key}')" class="text-[9px] text-zinc-300 hover:text-white bg-black/70 px-1.5 py-0.5 rounded"><i class="fa-solid fa-plus"></i></button>`;
        }
        html += `</div>`;

        if (releases.length > 0) {
          html += `
            <div class="truncate text-[10px] text-zinc-200 flex items-center gap-1 relative z-10 font-medium">
              <span class="w-1.5 h-1.5 rounded-full ${isToday ? 'bg-purple-400 animate-pulse' : 'bg-purple-500'} shrink-0"></span>
              <span class="truncate">${releases[0].title}</span>
            </div>
          `;
        }
        dayCell.innerHTML = html;
        dayCell.onclick = () => openDayModal(key, day, monthNames[month]);
        grid.appendChild(dayCell);
      }
    }

    function openDayModal(key, day, monthName) {
      const items = db[key] || [];
      const isToday = key === getTodayKey();

      let html = `
        <div class="mb-6 flex justify-between items-center border-b border-subtle pb-4">
          <div>
            <h3 class="text-base font-medium text-white">${day} de ${monthName}</h3>
            ${isToday ? `<p class="text-[11px] text-purple-400 font-medium mt-0.5">🎉 ¡Feliz Cumpleaños!</p>` : ''}
          </div>
          <button onclick="copyDayLink('${key}')" class="text-xs text-zinc-500 hover:text-zinc-300 transition">
            <i class="fa-solid fa-share-nodes"></i> Compartir
          </button>
        </div>
      `;

      if (items.length === 0) {
        html += `<p class="text-xs text-zinc-600 italic py-6 text-center">Sin lanzamientos.</p>`;
      } else {
        for (let i = 0; i < items.length; i++) {
          const item = items[i];

          html += `
            <div class="mb-4 p-3 rounded-xl border border-subtle bg-black flex items-center gap-3">
              <img src="${item.cover}" onerror="handleImageError(this)" class="w-12 h-12 rounded-lg object-cover bg-zinc-900 shadow-md">
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2">
                  <h4 class="font-medium text-xs text-white truncate cursor-pointer hover:text-purple-400 transition" onclick="showAlbumPage('${key}', '${item.id}')">${item.title}</h4>
                  ${item.isMainCover ? `<span class="text-[9px] bg-purple-900/60 text-purple-300 border border-purple-700/60 px-1.5 py-0.5 rounded">Portada</span>` : ''}
                </div>
                <p class="text-[11px] text-zinc-500 truncate">${item.artist || 'Artista'}${item.year ? ` • ${item.year}` : ''}</p>
                <div class="flex gap-2 mt-1">
                  ${item.spotify ? `<a href="${item.spotify}" target="_blank" class="text-[10px] text-zinc-400 hover:text-emerald-400"><i class="fa-brands fa-spotify"></i> Spotify</a>` : ''}
                  ${item.apple ? `<a href="${item.apple}" target="_blank" class="text-[10px] text-zinc-400 hover:text-pink-400"><i class="fa-brands fa-apple"></i> Apple</a>` : ''}
                </div>
              </div>
              ${isAdmin ? `
                <div class="flex items-center gap-1.5">
                  ${i > 0 ? `<button onclick="moveAlbumOrder('${key}', ${i}, -1)" class="text-xs text-zinc-400 hover:text-white p-1" title="Subir"><i class="fa-solid fa-arrow-up"></i></button>` : ''}
                  ${i < items.length - 1 ? `<button onclick="moveAlbumOrder('${key}', ${i}, 1)" class="text-xs text-zinc-400 hover:text-white p-1" title="Bajar"><i class="fa-solid fa-arrow-down"></i></button>` : ''}
                  <button onclick="openEditForm('${key}', '${item.id}')" class="text-xs text-zinc-400 hover:text-amber-400 p-1"><i class="fa-solid fa-pen"></i></button>
                  <button onclick="deleteAlbum('${key}', '${item.id}')" class="text-xs text-zinc-400 hover:text-rose-400 p-1"><i class="fa-solid fa-trash"></i></button>
                </div>
              ` : ''}
            </div>
          `;
        }
      }

      if (isAdmin) {
        html += `<button onclick="openEditForm('${key}')" class="w-full mt-2 py-2 border border-subtle hover:border-zinc-700 text-zinc-300 text-xs rounded-xl transition">+ Agregar Álbum</button>`;
      }

      document.getElementById('modalContent').innerHTML = html;
      document.getElementById('modal').classList.remove('hidden');
      document.getElementById('modal').classList.add('flex');
    }

    function openEditForm(key, albumId = null) {
      const item = albumId && db[key] ? db[key].find(a => a.id === albumId) : { title: '', artist: '', year: '', note: '', cover: '', spotify: '', apple: '', isMainCover: false };
      
      let html = `
        <h3 class="text-sm font-medium text-white mb-4">${albumId ? 'Editar Álbum' : 'Agregar Álbum'}</h3>
        <form onsubmit="saveAlbumForm(event, '${key}', '${albumId || ''}')" class="space-y-3">
          <div>
            <label class="text-[10px] text-zinc-500 uppercase">Álbum / Canción</label>
            <input type="text" id="formTitle" value="${item.title}" required class="w-full bg-black border border-subtle rounded-lg p-2 text-xs text-white focus:outline-none focus:border-zinc-700">
          </div>
          <div>
            <label class="text-[10px] text-zinc-500 uppercase">Artista</label>
            <input type="text" id="formArtist" value="${item.artist}" class="w-full bg-black border border-subtle rounded-lg p-2 text-xs text-white focus:outline-none focus:border-zinc-700">
          </div>
          <div>
            <label class="text-[10px] text-zinc-500 uppercase">Año de Lanzamiento</label>
            <input type="number" id="formYear" value="${item.year || ''}" placeholder="Ej: 2016" class="w-full bg-black border border-subtle rounded-lg p-2 text-xs text-white focus:outline-none focus:border-zinc-700">
          </div>
          <div>
            <label class="text-[10px] text-zinc-500 uppercase">Spotify Link</label>
            <input type="url" id="formSpotify" value="${item.spotify || ''}" class="w-full bg-black border border-subtle rounded-lg p-2 text-xs text-white focus:outline-none focus:border-zinc-700">
          </div>
          <div>
            <label class="text-[10px] text-zinc-500 uppercase">Apple Music Link</label>
            <input type="url" id="formApple" value="${item.apple || ''}" class="w-full bg-black border border-subtle rounded-lg p-2 text-xs text-white focus:outline-none focus:border-zinc-700">
          </div>
          <div>
            <label class="text-[10px] text-zinc-500 uppercase">URL Portada Imagen (Opcional)</label>
            <input type="url" id="formCover" value="${item.cover || ''}" class="w-full bg-black border border-subtle rounded-lg p-2 text-xs text-white focus:outline-none focus:border-zinc-700">
          </div>
          <div>
            <label class="text-[10px] text-zinc-500 uppercase">Nota</label>
            <textarea id="formNote" class="w-full bg-black border border-subtle rounded-lg p-2 text-xs text-white focus:outline-none focus:border-zinc-700">${item.note || ''}</textarea>
          </div>
          <div class="flex items-center gap-2 pt-1">
            <input type="checkbox" id="formIsMainCover" ${item.isMainCover ? 'checked' : ''} class="rounded bg-black border-subtle text-purple-600 focus:ring-0">
            <label for="formIsMainCover" class="text-xs text-zinc-300 cursor-pointer">Usar como portada de fondo de este día</label>
          </div>
          <button type="submit" id="saveSubmitBtn" class="w-full bg-white text-black py-2 rounded-lg font-medium text-xs transition hover:bg-zinc-200 mt-2">Guardar</button>
        </form>
      `;

      document.getElementById('modalContent').innerHTML = html;
      document.getElementById('modal').classList.remove('hidden');
      document.getElementById('modal').classList.add('flex');
    }

    function saveAlbumForm(e, key, albumId) {
      e.preventDefault();

      if (!db[key]) db[key] = [];

      const title = document.getElementById('formTitle').value;
      const artist = document.getElementById('formArtist').value;
      const year = document.getElementById('formYear').value;
      const spotify = document.getElementById('formSpotify').value;
      const apple = document.getElementById('formApple').value;
      let cover = document.getElementById('formCover').value || 'https://images.placeholders.dev/?width=300&height=300&text=🎵&bgColor=%23111111&textColor=%23777777';
      const isMainCover = document.getElementById('formIsMainCover').checked;

      if (isMainCover) {
        db[key].forEach(a => a.isMainCover = false);
      }

      const newAlbum = {
        id: albumId || String(Date.now()),
        title: title,
        artist: artist,
        year: year,
        spotify: spotify,
        apple: apple,
        cover: cover,
        isMainCover: isMainCover,
        note: document.getElementById('formNote').value
      };

      if (albumId) {
        const idx = db[key].findIndex(a => a.id === albumId);
        if (idx !== -1) db[key][idx] = newAlbum;
      } else {
        db[key].push(newAlbum);
      }

      saveDB();
      closeModal();

      if (isIsolatedMode) {
        renderIsolatedDayView(key);
      }
    }

    function moveAlbumOrder(key, index, direction) {
      const items = db[key];
      const targetIndex = index + direction;
      if (targetIndex >= 0 && targetIndex < items.length) {
        const temp = items[index];
        items[index] = items[targetIndex];
        items[targetIndex] = temp;
        saveDB();
        const dateObj = new Date(2026, parseInt(key.split('-')[0]) - 1, parseInt(key.split('-')[1]));
        openDayModal(key, dateObj.getDate(), monthNames[dateObj.getMonth()]);
      }
    }

    function deleteAlbum(key, albumId) {
      if (confirm("¿Eliminar este álbum?")) {
        db[key] = db[key].filter(a => a.id !== albumId);
        saveDB();
        closeModal();
      }
    }

    function showAlbumPage(key, albumId) {
      const album = db[key].find(a => a.id === albumId);
      closeModal();
      document.getElementById('mainView').classList.add('hidden');
      const albumPage = document.getElementById('albumPage');
      const isToday = key === getTodayKey();

      let coverUrl = album ? album.cover : '';

      const glowBg = document.getElementById('albumGlowBg');
      if (coverUrl) {
        glowBg.style.backgroundImage = `url("${coverUrl}")`;
      }
      
      document.getElementById('albumPageContent').innerHTML = `
        <div class="flex flex-col sm:flex-row gap-6 items-center">
          <img src="${coverUrl}" onerror="handleImageError(this)" class="w-48 h-48 object-cover rounded-xl border border-subtle bg-zinc-900 shadow-2xl">
          <div class="flex-1 text-center sm:text-left">
            ${isToday ? `<p class="text-xs text-purple-400 font-medium tracking-wide mb-2">🎉 ¡Feliz Cumpleaños!</p>` : ''}
            <h1 class="text-xl font-medium text-white mb-1">${album ? album.title : ''}</h1>
            <h3 class="text-sm text-zinc-400 mb-4">${album ? album.artist || '' : ''}${album && album.year ? ` • ${album.year}` : ''}</h3>
            ${album && album.note ? `<p class="text-xs text-zinc-300 italic mb-6 bg-black/60 p-3 rounded-lg border border-subtle backdrop-blur-md">"${album.note}"</p>` : ''}
            <div class="flex flex-wrap gap-3 justify-center sm:justify-start">
              ${album && album.spotify ? `<a href="${album.spotify}" target="_blank" class="border border-subtle bg-black/40 backdrop-blur-md text-zinc-300 hover:text-white text-xs px-3.5 py-1.5 rounded-lg flex items-center gap-2 transition"><i class="fa-brands fa-spotify text-emerald-400"></i> Spotify</a>` : ''}
              ${album && album.apple ? `<a href="${album.apple}" target="_blank" class="border border-subtle bg-black/40 backdrop-blur-md text-zinc-300 hover:text-white text-xs px-3.5 py-1.5 rounded-lg flex items-center gap-2 transition"><i class="fa-brands fa-apple text-pink-400"></i> Apple Music</a>` : ''}
            </div>
          </div>
        </div>
      `;
      albumPage.classList.remove('hidden');
    }

    function renderIsolatedDayView(fecha) {
      isIsolatedMode = true;
      document.getElementById('mainView').classList.add('hidden');
      document.getElementById('brandLogo').onclick = null;
      document.getElementById('brandLogo').classList.remove('cursor-pointer');

      const albums = db[fecha] || [];
      const isToday = fecha === getTodayKey();

      if (albums.length === 0) {
        document.getElementById('albumPageContent').innerHTML = `<p class="text-xs text-zinc-500 italic text-center py-8">No hay lanzamientos registrados para esta fecha.</p>`;
      } else {
        let htmlContent = '';
        for (const album of albums) {
          htmlContent += `
            <div class="flex flex-col sm:flex-row gap-6 items-center border-b border-subtle/50 pb-6 mb-6 last:border-none last:pb-0 last:mb-0">
              <img src="${album.cover}" onerror="handleImageError(this)" class="w-48 h-48 object-cover rounded-xl border border-subtle bg-zinc-900 shadow-xl">
              <div class="flex-1 text-center sm:text-left">
                ${isToday ? `<p class="text-xs text-purple-400 font-medium tracking-wide mb-2">🎉 ¡Feliz Cumpleaños!</p>` : ''}
                <h1 class="text-xl font-medium text-white mb-1">${album.title}</h1>
                <h3 class="text-sm text-zinc-400 mb-4">${album.artist || ''}${album.year ? ` • ${album.year}` : ''}</h3>
                ${album.note ? `<p class="text-xs text-zinc-400 italic mb-6 bg-black p-3 rounded-lg border border-subtle">"${album.note}"</p>` : ''}
                <div class="flex gap-3 justify-center sm:justify-start">
                  ${album.spotify ? `<a href="${album.spotify}" target="_blank" class="border border-subtle text-zinc-300 hover:text-white text-xs px-3.5 py-1.5 rounded-lg flex items-center gap-2 transition"><i class="fa-brands fa-spotify text-emerald-400"></i> Spotify</a>` : ''}
                  ${album.apple ? `<a href="${album.apple}" target="_blank" class="border border-subtle text-zinc-300 hover:text-white text-xs px-3.5 py-1.5 rounded-lg flex items-center gap-2 transition"><i class="fa-brands fa-apple text-pink-400"></i> Apple Music</a>` : ''}
                </div>
              </div>
            </div>
          `;
        }
        document.getElementById('albumPageContent').innerHTML = htmlContent;
      }

      document.getElementById('albumPage').classList.remove('hidden');
    }

    function goHome() {
      if (isIsolatedMode) return;
      document.getElementById('albumPage').classList.add('hidden');
      document.getElementById('mainView').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
      document.getElementById('modal').classList.remove('flex');
    }

    function copyDayLink(key) {
      const url = `${window.location.origin}${window.location.pathname}?fecha=${key}`;
      navigator.clipboard.writeText(url);
      alert('¡Enlace único del día copiado!\n' + url);
    }

    window.onload = () => {
      const urlParams = new URLSearchParams(window.location.search);
      const fecha = urlParams.get('fecha');

      if (fecha && db[fecha]) {
        renderIsolatedDayView(fecha);
      } else {
        renderCalendar(currentMonth);
      }
    };
  </script>
</body>
</html>
